name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Upload DMG
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check release version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must match Info.plist version: v$version" >&2; exit 1; }

      - name: Run core tests
        run: swift test

      - name: Build verification app
        run: scripts/build-app.sh debug

      - name: Run native integration checks
        run: dist/Pasteboard.app/Contents/MacOS/Pasteboard --self-test

      - name: Build app
        run: scripts/build-app.sh release

      - name: Package DMG
        run: scripts/build-dmg.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Pasteboard-*.dmg
            dist/Pasteboard-*.dmg.sha256
