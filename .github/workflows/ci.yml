name: CI

on:
  push:
    branches: [main]
  pull_request:
    # ui/** so stacked UI pull requests (based on another ui/ branch) also get CI.
    branches: [main, 'ui/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Design tokens
        # Font sizes and corner radii come from DesignTokens.swift.
        run: |
          if grep -RnE '\.system\(size: *[0-9]|cornerRadius: *[0-9]' Sources --include='*.swift' | grep -v '/DesignTokens.swift:'; then
            echo "::error::Use DesignTokens (Font.scaled / DesignTokens.Radius) instead of literal font sizes or corner radii."
            exit 1
          fi

      - name: Build app and App Intents metadata
        run: scripts/build-app.sh debug

      - name: Run tests
        run: swift test

      - name: Run native integration checks
        run: dist/Pasteboard.app/Contents/MacOS/Pasteboard --self-test

      - name: Render UI snapshots
        run: dist/Pasteboard.app/Contents/MacOS/Pasteboard --render-snapshots "$RUNNER_TEMP/snapshots"

      - name: Upload UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn
