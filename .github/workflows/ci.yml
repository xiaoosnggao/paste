name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app and App Intents metadata
        run: scripts/build-app.sh debug

      - name: Run tests
        run: swift test

      - name: Run native integration checks
        run: dist/Pasteboard.app/Contents/MacOS/Pasteboard --self-test
